# Kullanıcı indirmesi: `v*` tag'i pushlanınca Windows'ta TEK elfsec.exe derlenir
# (CLI + guard birleşik, --tray arka plan). İkinci guard exe yoktur.
# ve GitHub Releases'e otomatik eklenir.
# Kullanım: git tag v0.2.0; git push origin v0.2.0
name: release-exe

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.13.0
      - run: pyinstaller --noconfirm --clean --onefile --console --name elfsec elfsec.py
      - run: .\dist\elfsec.exe health
      - uses: actions/upload-artifact@v4
        with:
          name: elfsec-windows
          path: backend/dist/elfsec.exe
      - uses: softprops/action-gh-release@v3
        with:
          files: backend/dist/elfsec.exe
          generate_release_notes: true
