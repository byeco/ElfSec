# Kullanıcı indirmesi: `v*` tag'i pushlanınca Windows'ta TEK elfsec.exe derlenir
# (CLI + guard + Windows eklentisi birleşik) ve GitHub Releases'e yüklenir.
# Kullanım: git tag v1.4.1; git push origin v1.4.1
name: release-exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.13.0
      - run: >
          pyinstaller --noconfirm --clean --onefile --console --name elfsec
          --hidden-import imap_tools --hidden-import bleach --hidden-import lxml
          --hidden-import pydantic_settings --hidden-import app.win_service
          --hidden-import app.win_plugin --hidden-import app.native_host
          --hidden-import app.verified_senders --hidden-import app.services.file_scanner
          --hidden-import app.watchers.file_watcher
          --hidden-import app.watchers.clipboard_guard
          elfsec.py
      - run: .\dist\elfsec.exe health
      - run: .\dist\elfsec.exe kontrol --fail-only --fail-on HIGH
      - working-directory: .
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath elfsec-browser-extension.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: elfsec-windows
          path: |
            backend/dist/elfsec.exe
            elfsec-browser-extension.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dist/elfsec.exe
            elfsec-browser-extension.zip
          generate_release_notes: true
