<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title>ElfSec Güvenlik Eklentisi</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #0f172a;
      --muted: #5b6b82;
      --border: #dbe3ee;
      --brand: #059669;
      --brand-strong: #047857;
      --brand-soft: #ecfdf5;
      --ok: #059669;
      --ok-soft: #ecfdf5;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --bad: #b91c1c;
      --bad-soft: #fef2f2;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --focus: 0 0 0 3px rgba(5, 150, 105, 0.28);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --panel: #111c31;
        --panel-2: #0f172a;
        --text: #e8eefc;
        --muted: #9fb0c7;
        --border: #24344f;
        --brand: #34d399;
        --brand-strong: #10b981;
        --brand-soft: rgba(16, 185, 129, 0.14);
        --ok: #34d399;
        --ok-soft: rgba(16, 185, 129, 0.14);
        --warn: #fbbf24;
        --warn-soft: rgba(245, 158, 11, 0.16);
        --bad: #fca5a5;
        --bad-soft: rgba(239, 68, 68, 0.16);
        --shadow: 0 12px 36px rgba(2, 6, 23, 0.5);
        --focus: 0 0 0 3px rgba(52, 211, 153, 0.32);
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 380px;
      max-height: 580px;
      margin: 0;
      padding: 14px;
      overflow-y: auto;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }

    h1, h2, p { margin: 0; }
    strong { font-weight: 700; }

    /* ---------- Başlık ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      padding: 5px;
      background: var(--brand-soft);
      border: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .brand { flex: 1; min-width: 0; }

    .brand h1 {
      font-size: 16px;
      letter-spacing: 0.2px;
      line-height: 1.2;
    }

    .brand .tagline {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
    }

    .pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 auto;
    }

    .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
    .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

    /* ---------- İstatistikler ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 6px 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat .stat-icon { font-size: 15px; line-height: 1; }

    .stat strong {
      display: block;
      font-size: 19px;
      line-height: 1.25;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .stat .stat-label {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ---------- Kartlar ---------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px;
      margin-top: 8px;
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .hint { color: var(--muted); font-size: 11px; }

    /* ---------- Açma/kapama ---------- */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-copy { display: flex; flex-direction: column; gap: 2px; }
    .toggle-copy small { color: var(--muted); font-size: 11px; }

    .switch { position: relative; width: 52px; height: 30px; flex: 0 0 auto; }

    .switch input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #cbd5e1;
      border: 1px solid var(--border);
      transition: background 0.18s ease;
    }

    .slider::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.3);
      transition: transform 0.18s ease;
    }

    .switch input:checked + .slider { background: var(--brand-strong); }
    .switch input:checked + .slider::after { transform: translateX(22px); }
    .switch input:focus-visible + .slider { box-shadow: var(--focus); }

    /* ---------- Form ---------- */
    textarea {
      width: 100%;
      min-height: 58px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 11px;
      font: inherit;
      font-size: 12.5px;
    }

    textarea::placeholder { color: var(--muted); opacity: 0.85; }
    textarea:focus-visible { outline: none; box-shadow: var(--focus); border-color: var(--brand); }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    button:active { transform: translateY(1px); }
    button:focus-visible { outline: none; box-shadow: var(--focus); }
    button:disabled { opacity: 0.6; cursor: progress; }

    button.primary {
      width: 100%;
      margin-top: 8px;
      background: var(--brand-strong);
      color: #ffffff;
    }

    button.primary:hover:not(:disabled) { filter: brightness(1.07); }

    button.secondary {
      width: 100%;
      margin-top: 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover { background: var(--panel-2); }

    /* ---------- Tarama sonucu ---------- */
    .result {
      display: none;
      margin-top: 9px;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.45;
      border: 1px solid transparent;
      word-break: break-word;
    }

    .result.show { display: block; }
    .result.ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(5, 150, 105, 0.25); }
    .result.warn { background: var(--warn-soft); color: var(--warn); border-color: rgba(180, 83, 9, 0.25); }
    .result.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(185, 28, 28, 0.25); }

    /* ---------- Alarm listesi ---------- */
    ul.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }

    li.alert {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 9px;
      align-items: start;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--muted);
      border-radius: 10px;
      padding: 8px 10px;
    }

    li.alert[data-level="MEDIUM"] { border-left-color: #f59e0b; }
    li.alert[data-level="HIGH"],
    li.alert[data-level="CRITICAL"] { border-left-color: #ef4444; }

    .alert-level {
      grid-row: span 2;
      align-self: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    li.alert[data-level="MEDIUM"] .alert-level { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
    li.alert[data-level="HIGH"] .alert-level,
    li.alert[data-level="CRITICAL"] .alert-level { color: var(--bad); background: var(--bad-soft); border-color: transparent; }

    .alert-main {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .alert-meta { color: var(--muted); font-size: 10.5px; }

    .empty {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      background: var(--panel-2);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding: 0 2px;
      color: var(--muted);
      font-size: 10.5px;
    }
  </style>
</head>
<body>
  <header class="header">
    <img class="logo" src="icons/icon48.png" alt="" width="40" height="40" />
    <div class="brand">
      <h1>ElfSec</h1>
      <p class="tagline">Yerel e-posta ve indirme koruması</p>
    </div>
    <span id="nativeStatus" class="pill warn" role="status">Kontrol ediliyor</span>
  </header>

  <section class="stats" aria-label="Koruma istatistikleri">
    <div class="stat"><span class="stat-icon" aria-hidden="true">🛡️</span><strong id="statScanned">0</strong><span class="stat-label">Taranan</span></div>
    <div class="stat"><span class="stat-icon" aria-hidden="true">⚠️</span><strong id="statThreats">0</strong><span class="stat-label">Tehdit</span></div>
    <div class="stat"><span class="stat-icon" aria-hidden="true">✅</span><strong id="statVerified">0</strong><span class="stat-label">Doğrulanan</span></div>
  </section>

  <section class="card">
    <label class="toggle-row" for="enabledToggle">
      <span class="toggle-copy">
        <strong id="toggleLabel">Koruma açık</strong>
        <small>Webmail ve indirme kalkanı</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="slider" aria-hidden="true"></span>
      </span>
    </label>
  </section>

  <section class="card">
    <div class="card-head">
      <strong>Hızlı tarama</strong>
      <span class="hint">Link / ClickFix</span>
    </div>
    <textarea id="quickInput" rows="2" placeholder="Şüpheli link veya PowerShell/CMD komutu yapıştırın…"></textarea>
    <button id="scanBtn" class="primary" type="button">Tara</button>
    <div id="quickResult" class="result" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <strong>Son alarmlar</strong>
      <span id="alertsCount" class="hint">0 kayıt</span>
    </div>
    <ul id="alertsList" class="alerts">
      <li class="empty">Henüz alarm yok. Şüpheli e-posta veya indirme yakalanınca burada görünür.</li>
    </ul>
  </section>

  <button id="optionsBtn" class="secondary" type="button">Ayarlar ve Mağaza Bağlantısı</button>

  <footer class="footer">
    <span>v<span id="appVersion">1.6.0</span> · %100 yerel</span>
    <span>ElfSec Guard</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
