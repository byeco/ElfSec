<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title>ElfSec Güvenlik Eklentisi</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      width: 396px;
      max-height: 590px;
      padding: 12px 14px 14px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
    }

    /* Üst Başlık */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .logo-wrap {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
      flex: 0 0 auto;
    }

    .brand { flex: 1; min-width: 0; }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand h1 {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .ver-tag {
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .brand .tagline {
      color: var(--muted);
      font-size: 11px;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .pill-btn {
      cursor: pointer;
      font: inherit;
    }

    .icon-square-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .icon-square-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .icon-square-btn:focus-visible { outline: none; box-shadow: var(--focus); }

    /* Sekmeler */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 32px;
      padding: 5px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn[aria-selected="true"] {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .tab-btn:focus-visible { outline: none; box-shadow: var(--focus); }

    .tab-badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
    }

    .tab-btn[aria-selected="true"] .tab-badge {
      background: var(--brand-strong);
      border-color: transparent;
      color: #ffffff;
    }

    .tab-panel[hidden] { display: none; }

    /* Hero Koruma Kartı */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 13px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .hero.is-active {
      border-color: rgba(16, 185, 129, 0.34);
      box-shadow: 0 6px 22px var(--brand-glow);
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .hero-shield {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--brand-soft);
      color: var(--brand);
      flex: 0 0 auto;
    }

    .hero.is-paused .hero-shield {
      background: var(--surface-2);
      color: var(--muted);
    }

    .hero-copy strong {
      display: block;
      font-size: 13.5px;
      font-weight: 800;
    }

    .hero-copy small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 1px;
    }

    /* 4'lü Metrikler */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 9px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .metric-val {
      display: block;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .metric-val.is-threat { color: var(--bad); }
    .metric-val.is-ok { color: var(--ok); }

    .metric-lbl {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    /* Kart */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 11px 12px;
      margin-top: 9px;
      box-shadow: var(--shadow-sm);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-2);
      letter-spacing: 0.01em;
    }

    .hint { color: var(--muted); font-size: 11px; }

    /* Hızlı Kalkan Izgarası */
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .mini-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .mini-toggle input {
      accent-color: var(--brand-strong);
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
    }

    /* Son Tarama Özeti */
    .last-scan-box {
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .last-scan-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .last-scan-title {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .last-scan-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    /* Hızlı Tarama Sekmesi */
    .scan-textarea {
      min-height: 92px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
    }

    .scan-actions {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }

    .scan-actions .elf-btn-primary { flex: 1; }

    .scan-result {
      display: none;
      margin-top: 10px;
      padding: 11px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .scan-result.show { display: block; }

    .scan-res-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .scan-res-score {
      font-size: 12.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .scan-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .scan-tag {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
    }

    .scan-tag.bad {
      background: var(--bad-soft);
      border-color: transparent;
      color: var(--bad);
    }

    .scan-reasons {
      margin: 8px 0 0;
      padding-left: 16px;
      font-size: 11.5px;
      color: var(--text-2);
    }

    .scan-reasons li { margin: 3px 0; word-break: break-word; }

    /* Alarmlar Sekmesi */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .filter-pills {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn.is-active {
      background: var(--brand-soft);
      border-color: transparent;
      color: var(--brand);
    }

    ul.alerts {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    li.alert {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 3px 9px;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--muted);
      border-radius: 10px;
      padding: 8px 10px;
    }

    li.alert[data-level="MEDIUM"] { border-left-color: var(--warn-accent); }
    li.alert[data-level="HIGH"],
    li.alert[data-level="CRITICAL"] { border-left-color: var(--bad); }

    .alert-src-ico {
      grid-row: span 2;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      display: grid;
      place-items: center;
    }

    .alert-main {
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .alert-meta {
      grid-column: 2 / 4;
      color: var(--muted);
      font-size: 10.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-box {
      padding: 14px 12px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    /* Alt Alan */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .footer-link {
      background: none;
      border: 0;
      padding: 2px 4px;
      color: var(--brand);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .footer-link:hover { text-decoration: underline; }
    .footer-link:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 4px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo-wrap">
      <img src="icons/icon48.png" alt="" width="28" height="28" />
    </div>
    <div class="brand">
      <div class="brand-row">
        <h1>ElfSec</h1>
        <span class="ver-tag">v<span id="appVersion">1.6.0</span></span>
      </div>
      <p class="tagline" data-i18n="tagline">Yerel e-posta ve indirme koruması</p>
    </div>
    <div class="topbar-actions">
      <button id="nativeStatus" class="elf-pill warn pill-btn" type="button" data-i18n="statusChecking">Kontrol ediliyor</button>
      <button id="settingsIconBtn" class="icon-square-btn" type="button" data-i18n-title="openSettings" data-i18n-aria="openSettings" title="Ayarlar">
        <svg class="elf-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Bölümler">
    <button class="tab-btn" role="tab" id="tabBtnOverview" aria-selected="true" aria-controls="panelOverview" data-tab="overview" data-i18n="tabOverview">Genel</button>
    <button class="tab-btn" role="tab" id="tabBtnScan" aria-selected="false" aria-controls="panelScan" data-tab="scan" data-i18n="tabScan">Hızlı Tarama</button>
    <button class="tab-btn" role="tab" id="tabBtnAlerts" aria-selected="false" aria-controls="panelAlerts" data-tab="alerts">
      <span data-i18n="tabAlerts">Alarmlar</span>
      <span id="alertsTabBadge" class="tab-badge">0</span>
    </button>
  </nav>

  <!-- SEKME 1: GENEL -->
  <section id="panelOverview" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnOverview">
    <div id="heroCard" class="hero is-active">
      <div class="hero-left">
        <div class="hero-shield" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6 4.8 5.4v5.9c0 4.5 3.1 8.3 7.2 9.4 4.1-1.1 7.2-4.9 7.2-9.4V5.4L12 2.6Z"></path>
            <path d="m8.8 11.8 2.2 2.2 4.2-4.4"></path>
          </svg>
        </div>
        <div class="hero-copy">
          <strong id="toggleLabel">Koruma Aktif</strong>
          <small id="toggleSub">Webmail, link ve indirme kalkanı devrede</small>
        </div>
      </div>
      <label class="elf-switch lg" aria-label="Korumayı aç veya kapat">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="elf-slider" aria-hidden="true"></span>
      </label>
    </div>

    <div class="metrics" aria-label="Koruma istatistikleri">
      <div class="metric">
        <strong id="statEmails" class="metric-val">0</strong>
        <span class="metric-lbl" data-i18n="statEmails">E-posta</span>
      </div>
      <div class="metric">
        <strong id="statDownloads" class="metric-val">0</strong>
        <span class="metric-lbl" data-i18n="statDownloads">İndirme</span>
      </div>
      <div class="metric">
        <strong id="statThreats" class="metric-val is-threat">0</strong>
        <span class="metric-lbl" data-i18n="statThreats">Tehdit</span>
      </div>
      <div class="metric">
        <strong id="statVerified" class="metric-val is-ok">0</strong>
        <span class="metric-lbl" data-i18n="statVerified">Doğrulanan</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title" data-i18n="quickToggles">Hızlı Kalkanlar</span>
      </div>
      <div class="quick-grid">
        <label class="mini-toggle"><span data-i18n="modWebmailShort">Webmail</span><input type="checkbox" id="qWebmail" checked /></label>
        <label class="mini-toggle"><span data-i18n="modModalShort">Link Modalı</span><input type="checkbox" id="qModal" checked /></label>
        <label class="mini-toggle"><span data-i18n="modDownloadsShort">İndirme</span><input type="checkbox" id="qDownloads" checked /></label>
        <label class="mini-toggle"><span data-i18n="modTrackerShort">Takip Pikseli</span><input type="checkbox" id="qTracker" checked /></label>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title" data-i18n="lastScanTitle">Son Tarama</span>
        <span id="lastScanTime" class="hint"></span>
      </div>
      <div id="lastScanBody" class="empty-box" data-i18n="lastScanEmpty">Henüz tarama kaydı yok.</div>
    </div>
  </section>

  <!-- SEKME 2: HIZLI TARAMA -->
  <section id="panelScan" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnScan" hidden>
    <div class="card" style="margin-top:0;">
      <div class="card-head">
        <span class="card-title" data-i18n="quickScanTitle">URL / Metin / ClickFix Tarama</span>
        <span class="hint" data-i18n="quickScanHint">Ctrl + Enter</span>
      </div>
      <textarea id="quickInput" class="elf-textarea scan-textarea" data-i18n-placeholder="quickScanPlaceholder" placeholder="Şüpheli link, e-posta metni veya PowerShell/CMD komutu yapıştırın…"></textarea>
      <div class="scan-actions">
        <button id="scanBtn" class="elf-btn elf-btn-primary" type="button" data-i18n="scanBtn">Tara</button>
        <button id="clearInputBtn" class="elf-btn elf-btn-secondary" type="button" data-i18n="clearInputBtn">Temizle</button>
      </div>
      <div id="quickResult" class="scan-result" role="status" aria-live="polite"></div>
    </div>
  </section>

  <!-- SEKME 3: ALARMLAR -->
  <section id="panelAlerts" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnAlerts" hidden>
    <div class="card" style="margin-top:0;">
      <div class="filter-bar">
        <div class="filter-pills" role="group" aria-label="Risk filtresi">
          <button type="button" class="filter-btn is-active" data-filter="all" data-i18n="filterAll">Tümü</button>
          <button type="button" class="filter-btn" data-filter="high" data-i18n="filterHigh">Yüksek+</button>
          <button type="button" class="filter-btn" data-filter="medium" data-i18n="filterMedium">Orta</button>
        </div>
        <span id="alertsCount" class="hint">0 kayıt</span>
      </div>
      <ul id="alertsList" class="alerts"></ul>
    </div>
  </section>

  <footer class="footer">
    <span><span data-i18n="footerLocal">%100 Yerel</span> · ElfSec Guard</span>
    <button id="optionsBtn" class="footer-link" type="button" data-i18n="openSettings">Ayarlar ve Mağaza Bağlantısı</button>
  </footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
